workflows:
  ios-testflight:
    integrations:
      app_store_connect: "AppStoreConnect"
    environment:
      flutter: 3.47.5
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fcwe1113.busArrivalNotificationApp
    scripts:
      - name: Generate secrets configuration
        script: |
          mkdir -p config
          echo "$SECRETS_JSON" | base64 --decode > config/secrets.json
      - name: Debug signing state
        script: |
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "no profiles directory"
          security find-identity -v -p codesigning
      - name: Inspect Provisioning Profile
        script: |
          PROF=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          echo "=== Profile Name & App ID ==="
          security cms -D -i "$PROF" | grep -A 2 "<key>application-identifier</key>"
          echo "=== Profile Type ==="
          security cms -D -i "$PROF" | grep -A 1 "<key>get-task-allow</key>"
          echo "=== Team ID ==="
          security cms -D -i "$PROF" | grep -A 1 "<key>TeamIdentifier</key>"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: cd ios && pod install
      - name: Apply signing
        script: xcode-project use-profiles --archive-method=app-store --team-id=66RCG95DR7
      - name: Build ipa
        script: |
          flutter build ipa --release \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
    
